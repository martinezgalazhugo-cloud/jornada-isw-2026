    <h1>JORNADA DE INGENIERO EN SOFTWARE 2026</h1>
    <p><time datetime="2026-04-27">Lunes 27 de Abril de 2026</time></p>

    <img src="/img/ues-logo.png" alt="logo de ues" width="400px" height="400px">

</header>

<main>

    <ol>
        <li>Primer Evento</li>
        <li>Segundo Evento</li>
        <li>Tercer Evento</li>
        <li>Cuarto Evento</li>
    </ol>

    <section id="registro">

            <form action="" method="">

                <!-- Nombre-->
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                <br><br>

                <!-- Correo-->
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="Introduce tu correo" pattern="([0-9]{8}|[0-9]{11})@ues\.mx" required>
                <br><br>

                <!-- Seleccion -->
                <label for="Tipo">Selecciona tu tipo de asistencia:</label>
                <select id="Tipo" name="Tipo" required>
                    <option value="">-- Elige una opción --</option>
                    <option value="mx">Alumno</option>
                    <option value="es">Docente</option>
                </select>
                <br><br>

                <!-- Radio-->
                <label>Evento principal:</label>
                <input type="radio" id="Evento 1" name="Evento" value="evento 1" required>
                <label for="evento 1">Evento 1</label>
                <input type="radio" id="Evento 2" name="Evento" value="evento 2" required>
                <label for="evento 2">Evento 2</label>
                <input type="radio" id="Evento 3" name="Evento" value="evento 3" required>
                <label for="evento 3">Evento 3</label>
                <input type="radio" id="Evento 4" name="Evento" value="evento 4" required>
                <label for="evento 4">Evento 4</label>
                <br><br>
                

                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="5" cols="30" placeholder="Escribe tu comentario aquí"></textarea>
                <br><br>

                <input type="submit" value="Enviar">
            </form>
    </section>

</main>
